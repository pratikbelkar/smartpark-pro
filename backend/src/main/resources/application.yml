spring:
  application:
    name: smartpark-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartpark}
    username: ${POSTGRES_USER:pratikbelkar}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    # Dev-only 256-bit Base64 secret. Override via JWT_SECRET in any shared/prod env.
    secret: ${JWT_SECRET:sCdZ4flw6PRMp35IuBt96jpjxUNeM5AGmgeXKAVFEzo=}
    access-ttl-ms: ${JWT_ACCESS_TTL_MS:900000}
    refresh-ttl-ms: ${JWT_REFRESH_TTL_MS:604800000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  # Super-admin provisioning (dev defaults only — override via ADMIN_EMAIL /
  # ADMIN_PASSWORD env vars in any shared or production environment).
  admin:
    email: ${ADMIN_EMAIL:admin@smartpark.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
  mail:
    from: ${MAIL_FROM:noreply@smartpark.local}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  booking:
    hold-ttl-minutes: 10
    grace-period-minutes: 15
    convenience-fee-paise: 1000
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  # QR token derivation secret (dev default only — override in shared/prod envs).
  qr:
    secret: ${QR_SECRET:smartpark-dev-qr-secret-change-in-prod}

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
