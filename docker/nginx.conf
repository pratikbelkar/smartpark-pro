# Frontend static files + /api reverse proxy to the backend service.
# TLS terminates here in production (mount certs, add the 443 block from docs/DEPLOYMENT.md).
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback (React Router). The /api/ block above takes precedence.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}
